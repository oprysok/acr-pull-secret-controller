{{- if not .Values.registries }}
{{- fail "registries must contain at least one registry" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apsc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apsc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "apsc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "apsc.selectorLabels" . | nindent 8 }}
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ include "apsc.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --registry={{ join "," .Values.registries }}
            - --allowed-registry-suffixes={{ join "," .Values.allowedRegistrySuffixes }}
            - --secret-name={{ .Values.secretName }}
            - --namespace-selector={{ .Values.namespaceSelector }}
            - --refresh-fraction={{ .Values.refreshFraction }}
            - --leader-elect={{ gt (int .Values.replicas) 1 }}
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --zap-log-level={{ .Values.logLevel }}
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: probes, containerPort: 8081 }
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      nodeSelector:
        # The image is Linux-only; clusters may also run Windows node pools.
        kubernetes.io/os: linux
        {{- with .Values.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
