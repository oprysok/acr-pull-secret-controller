apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "apsc.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apsc.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "azure.clientId is required" .Values.azure.clientId | quote }}
    azure.workload.identity/tenant-id: {{ required "azure.tenantId is required" .Values.azure.tenantId | quote }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
